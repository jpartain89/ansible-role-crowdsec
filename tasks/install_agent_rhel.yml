---
# EPEL is available via standard repos on modern RHEL/Rocky 8+ if needed.
# - name: Crowdsec | install_agent_rhel | Enable EPEL Repository on Rocky/CentOS 8
#   ansible.builtin.dnf:
#     name: epel-release
#     state: present
#   when: ansible_facts['distribution_major_version'] == '8'

- name: Crowdsec | install_agent_rhel | Install required packages
  ansible.builtin.dnf:
    name:
      - yum-utils
    state: present

# https://packagecloud.io/crowdsec/crowdsec/install#manual-rpm
# packagecloud repos sign their metadata (repo_gpgcheck) via HTTPS but do not
# individually sign each RPM (gpgcheck). This is packagecloud's standard and
# documented security model: HTTPS transport + signed metadata provides integrity.
- name: Crowdsec | install_agent_rhel | Add CrowdSec repository
  ansible.builtin.yum_repository:
    name: crowdsec
    description: crowdsec repository
    baseurl: https://packagecloud.io/crowdsec/crowdsec/el/$releasever/$basearch
    gpgkey: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    gpgcheck: false
    repo_gpgcheck: true
    sslverify: true
    sslcacert: /etc/pki/tls/certs/ca-bundle.crt
    metadata_expire: '300'
    enabled: true
    state: present
    file: crowdsec

- name: Crowdsec | install_agent_rhel | Install CrowdSec agent
  ansible.builtin.dnf:
    name: crowdsec
    state: present
    update_cache: true
