---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: 'geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest'
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: '${MOLECULE_PROJECT_DIRECTORY}/..'
verifier:
  name: ansible
