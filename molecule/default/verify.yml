---
- name: crowdsec | default | Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: crowdsec | verify | Stat /etc/hosts
      ansible.builtin.stat:
        path: /etc/hosts
      register: hosts_file_stat

    - name: crowdsec | verify | Assert /etc/hosts Is Present
      ansible.builtin.assert:
        that:
          - hosts_file_stat.stat.exists
        fail_msg: '/etc/hosts does not exist'
        success_msg: '/etc/hosts exists'

    - name: crowdsec | verify | Stat /etc/crowdsec Config Directory
      ansible.builtin.stat:
        path: /etc/crowdsec
      register: crowdsec_config_dir

    - name: crowdsec | verify | Assert /etc/crowdsec Absent When Agent Not Installed
      ansible.builtin.assert:
        that:
          - not crowdsec_config_dir.stat.exists
        fail_msg: '/etc/crowdsec exists but agent installation was disabled'
        success_msg: '/etc/crowdsec absent as expected when cs_install_agent=false'
