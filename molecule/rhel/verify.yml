---
# Full-install verify for Rocky Linux 9 (RHEL family).
# Asserts every observable outcome of running the role with cs_install_agent=true.
- name: Crowdsec | rhel | Verify
  hosts: all
  gather_facts: true
  tasks:
    # -------------------------------------------------------------------
    # Package installation
    # -------------------------------------------------------------------
    - name: Crowdsec | verify | Gather rpm package facts
      ansible.builtin.package_facts:
        manager: rpm

    - name: Crowdsec | verify | Assert crowdsec package is installed
      ansible.builtin.assert:
        that:
          - '"crowdsec" in ansible_facts.packages'
        fail_msg: 'crowdsec package is not installed via dnf/rpm'
        success_msg: 'crowdsec package is installed'

    # -------------------------------------------------------------------
    # DNF repository
    # -------------------------------------------------------------------
    - name: Crowdsec | verify | Stat CrowdSec dnf repository file
      ansible.builtin.stat:
        path: /etc/yum.repos.d/crowdsec.repo
      register: crowdsec_repo_file

    - name: Crowdsec | verify | Assert CrowdSec dnf repository file is present
      ansible.builtin.assert:
        that:
          - crowdsec_repo_file.stat.exists
          - crowdsec_repo_file.stat.isreg
        fail_msg: '/etc/yum.repos.d/crowdsec.repo is missing'
        success_msg: 'CrowdSec dnf repository file exists'

    # -------------------------------------------------------------------
    # Configuration directory and key files
    # -------------------------------------------------------------------
    - name: Crowdsec | verify | Stat /etc/crowdsec config directory
      ansible.builtin.stat:
        path: /etc/crowdsec
      register: crowdsec_config_dir

    - name: Crowdsec | verify | Assert /etc/crowdsec directory exists
      ansible.builtin.assert:
        that:
          - crowdsec_config_dir.stat.exists
          - crowdsec_config_dir.stat.isdir
        fail_msg: '/etc/crowdsec directory does not exist after installation'
        success_msg: '/etc/crowdsec directory exists'

    - name: Crowdsec | verify | Stat /etc/crowdsec/config.yaml
      ansible.builtin.stat:
        path: /etc/crowdsec/config.yaml
      register: crowdsec_config_yaml

    - name: Crowdsec | verify | Assert /etc/crowdsec/config.yaml is present
      ansible.builtin.assert:
        that:
          - crowdsec_config_yaml.stat.exists
          - crowdsec_config_yaml.stat.isreg
        fail_msg: '/etc/crowdsec/config.yaml is missing after installation'
        success_msg: '/etc/crowdsec/config.yaml exists'

    # -------------------------------------------------------------------
    # Binaries
    # -------------------------------------------------------------------
    - name: Crowdsec | verify | Stat /usr/bin/crowdsec binary
      ansible.builtin.stat:
        path: /usr/bin/crowdsec
      register: crowdsec_bin

    - name: Crowdsec | verify | Assert /usr/bin/crowdsec is present and executable
      ansible.builtin.assert:
        that:
          - crowdsec_bin.stat.exists
          - crowdsec_bin.stat.executable
        fail_msg: '/usr/bin/crowdsec binary is missing or not executable'
        success_msg: '/usr/bin/crowdsec binary is present and executable'

    - name: Crowdsec | verify | Stat /usr/bin/cscli binary
      ansible.builtin.stat:
        path: /usr/bin/cscli
      register: cscli_bin

    - name: Crowdsec | verify | Assert /usr/bin/cscli is present and executable
      ansible.builtin.assert:
        that:
          - cscli_bin.stat.exists
          - cscli_bin.stat.executable
        fail_msg: '/usr/bin/cscli binary is missing or not executable'
        success_msg: '/usr/bin/cscli binary is present and executable'

    # -------------------------------------------------------------------
    # Systemd service
    # -------------------------------------------------------------------
    - name: Crowdsec | verify | Gather service facts
      ansible.builtin.service_facts:

    - name: Crowdsec | verify | Assert crowdsec service is registered in systemd
      ansible.builtin.assert:
        that:
          - '"crowdsec.service" in ansible_facts.services'
        fail_msg: 'crowdsec.service is not registered in systemd after installation'
        success_msg: 'crowdsec.service is registered in systemd'

    - name: Crowdsec | verify | Assert crowdsec service is enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['crowdsec.service']['status'] == 'enabled'
        fail_msg: 'crowdsec.service is not enabled'
        success_msg: 'crowdsec.service is enabled'
