name: main and pr builds

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: jpartain89.crowdsec

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jpartain89.crowdsec/requirements.txt

      - name: Install dependencies
        run: pip install ansible-lint==26.3.0 ansible==13.4.0

      - name: Run ansible-lint
        working-directory: jpartain89.crowdsec
        env:
          ANSIBLE_ROLES_PATH: '..'
        run: ansible-lint
